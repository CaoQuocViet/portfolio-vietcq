services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5678:5678"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_POCKETBASE_URL=http://server:8090
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/app/pb_data
    restart: unless-stopped

volumes:
  pb_data:
